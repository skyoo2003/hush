name: CI

on:
  # PR branches run once, through pull_request. push covers main after merge.
  push:
    branches: [main]
  pull_request:

# Never pull_request_target: PRs from forks run with a read-only token and no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Pinned, SHA-256-checked PDFium. tauri-build copies it for the bundle, and the PDF tests load it.
      - run: bash scripts/fetch-pdfium.sh
      - run: bash scripts/check-brand.sh
      - run: bash scripts/check-supporter.sh
      - run: bash scripts/check-spdx.sh
      # Signing secrets stay in release.yml, which runs on tags only (ADR-021).
      - run: bash scripts/check-workflows.sh
      - run: node scripts/check-npm-licenses.mjs
      # Networking APIs only in src-tauri/src/net; rewrites docs/network-deps.md for the drift check.
      - run: bash scripts/check-net-usage.sh
      - run: pnpm lint
      - run: pnpm contrast
      - run: pnpm typecheck
      - run: pnpm test
      # Also creates dist/, which generate_context!() embeds.
      - run: pnpm build
      - run: node scripts/check-dist-urls.mjs
      # The UI harness (src/dev, VITE_MOCK_IPC=1) must never reach a build.
      - run: "! grep -rlF __LOCITE_MOCK_IPC__ dist"
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # cargo test regenerates src/ipc/ through ts-rs.
      - name: Generated file drift check
        run: git diff --exit-code src/brand.ts src/funding.ts src-tauri/tauri.conf.json src/ipc docs/network-deps.md

  deny:
    # cargo-deny-action runs in Docker, which macOS runners lack. It reads metadata only, so Linux is fine.
    # Its entrypoint installs the toolchain from rust-toolchain.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans licenses sources

  audit:
    # cargo-deny checks the built graph; cargo-audit reads every Cargo.lock entry, so it also flags
    # locked crates no build uses. Vulnerabilities fail; unmaintained and unsound are warnings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - run: rustup toolchain install
      - run: cargo audit
        working-directory: src-tauri

  dco:
    # Dependabot cannot sign off. Keyed on the authenticated PR author, not the commit email anyone can set.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash scripts/check-dco.sh ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

  gitleaks:
    # The CLI, not gitleaks-action, so no token or license key is needed.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar xzf "$f" gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --redact --config .gitleaks.toml
