name: CI

on:
  # PR branches run once, through pull_request. push covers main after merge.
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Pinned, SHA-256-checked PDFium. tauri-build copies it for the bundle, and the PDF tests load it.
      - run: bash scripts/fetch-pdfium.sh
      - run: bash scripts/check-brand.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Also creates dist/, which generate_context!() embeds.
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Brand drift check
        run: git diff --exit-code src/brand.ts src-tauri/tauri.conf.json

  licenses:
    # cargo-deny-action runs in Docker, which macOS runners lack. It reads metadata only, so Linux is fine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses
