name: Release

# ADR-021. Secrets live in the `release` environment: the self-signed release certificate reaches only
# `sign`, the updater key only `sign-update`. Neither job runs a build script.
# scripts/check-workflows.sh keeps this trigger tag-only.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Versions match the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 -E '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          npm=$(jq -r .version package.json)
          echo "tag=$v tauri.conf.json=$conf Cargo.toml=$cargo package.json=$npm"
          [ "$conf" = "$v" ] && [ "$cargo" = "$v" ] && [ "$npm" = "$v" ]
      - name: CHANGELOG has a section for this version
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}"

  build:
    # The only job that runs pnpm install and cargo build scripts. It has no environment and no secrets.
    needs: gate
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No caches here: a release must not restore state that another workflow run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-pdfium.sh
      - run: pnpm tauri build --bundles app --target aarch64-apple-darwin
      - name: Install cargo-about and cargo-cyclonedx
        run: cargo install --locked cargo-about@0.9.3 --features cli && cargo install --locked cargo-cyclonedx@0.5.10
      - name: App, SBOM, notices, source, and notes
        run: |
          v=${GITHUB_REF_NAME#v}
          slug=$(grep -E '^pub const APP_SLUG:' src-tauri/src/brand.rs | grep -oE '"[^"]*"' | tr -d '"')
          mkdir -p out/app out/extras
          ditto -c -k --keepParent src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app out/app/app.zip
          (cd src-tauri && cargo cyclonedx --format json --spec-version 1.5 --target aarch64-apple-darwin --override-filename sbom)
          mv src-tauri/sbom.json "out/extras/${slug}-${v}.cdx.json"
          node scripts/third-party-notices.mjs out/extras/THIRD_PARTY_NOTICES.txt
          git archive --format=tar.gz --prefix="${slug}-${v}/" -o "out/extras/${slug}-${v}-source.tar.gz" "$GITHUB_REF_NAME"
          tar -tzf "out/extras/${slug}-${v}-source.tar.gz" | grep -qx "${slug}-${v}/src-tauri/Cargo.lock"
          tar -tzf "out/extras/${slug}-${v}-source.tar.gz" | grep -qx "${slug}-${v}/pnpm-lock.yaml"
          bash scripts/release-notes.sh "$v" > out/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: out/app/app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras
          path: |
            out/extras/
            out/release-notes.md
          if-no-files-found: error


  sign:
    # Holds the release certificate. Runs only this repository's scripts and Apple's tools on the built
    # app: no pnpm, cargo, or npm, and no third-party action except checkout and the artifact actions.
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: unsigned
      - name: Sign with the release certificate, then build the DMG and updater archive
        env:
          RELEASE_SIGNING_P12: ${{ secrets.RELEASE_SIGNING_P12 }}
          RELEASE_SIGNING_P12_PASSWORD: ${{ secrets.RELEASE_SIGNING_P12_PASSWORD }}
        run: |
          ditto -x -k unsigned/app.zip app
          bash scripts/sign-release.sh app/*.app out
          mkdir dmg update
          mv out/*.dmg dmg/
          mv out/*.app.tar.gz update/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-unsigned
          path: update/*.tar.gz
          if-no-files-found: error

  sign-update:
    # Holds the updater key (ADR-022). Runs the lockfile-pinned tauri CLI with install scripts disabled;
    # no build script runs here.
    needs: sign
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-unsigned
          path: update
      - name: Sign the updater archive and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          v=${GITHUB_REF_NAME#v}
          f=$(cd update && ls -- *.tar.gz)
          pnpm exec tauri signer sign --app-version "$v" "update/$f"
          bash scripts/release-notes.sh "$v" > notes.md
          bash scripts/make-latest-json.sh "$v" notes.md "update/$f.sig" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$f" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > update/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update
          path: update/
          if-no-files-found: error

  publish:
    needs: [build, sign, sign-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extras
          path: extras
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: update
      - name: SHA256SUMS
        run: |
          mv extras/extras/* assets/
          mv update/* assets/
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file extras/release-notes.md assets/*
