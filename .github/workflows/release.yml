name: Release

# ADR-021. Signing secrets live in the `release` environment and reach only the `sign` job, which runs
# no package manager and no build script. scripts/check-workflows.sh keeps this trigger tag-only.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Versions match the tag
        run: |
          v=${GITHUB_REF_NAME#v}
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(grep -m1 -E '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          npm=$(jq -r .version package.json)
          echo "tag=$v tauri.conf.json=$conf Cargo.toml=$cargo package.json=$npm"
          [ "$conf" = "$v" ] && [ "$cargo" = "$v" ] && [ "$npm" = "$v" ]
      - name: CHANGELOG has a section for this version
        run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}"

  build:
    # The only job that runs pnpm install and cargo build scripts. It has no environment and no secrets.
    needs: gate
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No caches here: a release must not restore state that another workflow run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fetch-pdfium.sh
      - run: pnpm tauri build --bundles app --target aarch64-apple-darwin
      - name: Install cargo-about and cargo-cyclonedx
        run: cargo install --locked cargo-about@0.9.3 --features cli && cargo install --locked cargo-cyclonedx@0.5.10
      - name: App, SBOM, notices, source, and notes
        run: |
          v=${GITHUB_REF_NAME#v}
          slug=$(grep -E '^pub const APP_SLUG:' src-tauri/src/brand.rs | grep -oE '"[^"]*"' | tr -d '"')
          mkdir -p out/app out/extras
          ditto -c -k --keepParent src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app out/app/app.zip
          (cd src-tauri && cargo cyclonedx --format json --spec-version 1.5 --target aarch64-apple-darwin --override-filename sbom)
          mv src-tauri/sbom.json "out/extras/${slug}-${v}.cdx.json"
          node scripts/third-party-notices.mjs out/extras/THIRD_PARTY_NOTICES.txt
          git archive --format=tar.gz --prefix="${slug}-${v}/" -o "out/extras/${slug}-${v}-source.tar.gz" "$GITHUB_REF_NAME"
          tar -tzf "out/extras/${slug}-${v}-source.tar.gz" | grep -qx "${slug}-${v}/src-tauri/Cargo.lock"
          tar -tzf "out/extras/${slug}-${v}-source.tar.gz" | grep -qx "${slug}-${v}/pnpm-lock.yaml"
          bash scripts/release-notes.sh "$v" > out/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: out/app/app.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extras
          path: |
            out/extras/
            out/release-notes.md
          if-no-files-found: error

  sign:
    # Holds the signing secrets. Runs only repo scripts and Apple's tools on the built app: no pnpm, cargo,
    # or npm, and no third-party action except checkout and the artifact actions.
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: unsigned
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          pw=$(openssl rand -hex 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          (umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one word per keychain path; runner keychain paths have no spaces
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          (umask 077; printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8")
      - name: Sign, notarize, and staple
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ditto -x -k unsigned/app.zip app
          NOTARY_KEY="$RUNNER_TEMP/notary.p8" bash scripts/sign-macos.sh app/*.app dmg
      - name: Check signatures and Gatekeeper
        run: |
          bash scripts/check-signatures.sh app/*.app --developer-id
          spctl -a -vv -t open --context context:primary-signature dmg/*.dmg
          xcrun stapler validate dmg/*.dmg
      - name: Updater archive of the stapled app
        run: |
          app=$(basename app/*.app)
          mkdir update
          COPYFILE_DISABLE=1 tar -czf "update/$app.tar.gz" -C app "$app"
      - name: Delete the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dmg/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-unsigned
          path: update/*.tar.gz
          if-no-files-found: error

  sign-update:
    # Holds only the updater key (ADR-022), apart from the Apple secrets. Runs the lockfile-pinned
    # tauri CLI with install scripts disabled; no build script runs here.
    needs: sign
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-unsigned
          path: update
      - name: Sign the updater archive and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          v=${GITHUB_REF_NAME#v}
          f=$(cd update && ls -- *.tar.gz)
          pnpm exec tauri signer sign --app-version "$v" "update/$f"
          bash scripts/release-notes.sh "$v" > notes.md
          bash scripts/make-latest-json.sh "$v" notes.md "update/$f.sig" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$f" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > update/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update
          path: update/
          if-no-files-found: error

  publish:
    needs: [build, sign, sign-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extras
          path: extras
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update
          path: update
      - name: SHA256SUMS
        run: |
          mv extras/extras/* assets/
          mv update/* assets/
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file extras/release-notes.md assets/*
