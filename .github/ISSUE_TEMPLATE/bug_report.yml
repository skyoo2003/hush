name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real document contents, queries, file names, paths, or keys. Use a minimal sample file instead.
        For security issues, follow [SECURITY.md](https://github.com/skyoo2003/locite/blob/main/SECURITY.md) instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options:
        - Apple M1
        - Apple M2
        - Apple M3
        - Apple M4
        - Apple M5
        - Intel
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs contain doc IDs only. Data and diagnostics > Export diagnostics saves them, with crash reports and counts, in one zip you can attach. Check that nothing private is included before attaching or pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed all document content. This report contains no private document text, queries, file names, paths, or keys.
          required: true
