name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real document contents, queries, file names, paths, or keys. Use a minimal sample file instead.
        For security issues, use private vulnerability reporting instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 26.1, Apple M4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs contain doc IDs only. Check that nothing private is included before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no private document content, queries, file names, paths, or keys.
          required: true
