[package]
name = "embed_bench_spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any future app workspace.
[workspace]

[dependencies]
candle-core = { version = "0.11.1", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.1", features = ["accelerate"] }
candle-transformers = { version = "0.11.1", features = ["accelerate"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
serde_json = "1"

[profile.release]
debug = false
