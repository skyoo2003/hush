# `cargo deny check licenses` keeps every dependency GPL-3.0-or-later compatible.
# Add a license here only after confirming GPL-3.0 compatibility in docs/decisions.md.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "blessing",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.9

# Vulnerabilities fail CI. Each ignore names an unmaintained transitive crate with no maintained
# replacement upstream; drop the entry once the parent crate moves off it.
[advisories]
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono, via pdfium-render only" },
  { id = "RUSTSEC-2024-0436", reason = "paste, a proc macro via candle, gemm, and tokenizers" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via the Linux-only gtk stack of tauri" },
]

[bans]
# Duplicate versions come from tauri and candle; warn so they stay visible without failing CI.
multiple-versions = "warn"
wildcards = "deny"
