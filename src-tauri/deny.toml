# `cargo deny check licenses` keeps every dependency GPL-3.0-only compatible.
# Add a license here only after confirming GPL-3.0 compatibility in docs/decisions.md.
[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "blessing",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
confidence-threshold = 0.9
