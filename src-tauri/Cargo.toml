[package]
name = "locite"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "locite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { version = "1", features = ["preserve_order"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }
sqlite-vec = "0.1.9"
zeroize = "1.9.2"
rand_core = { version = "0.9", features = ["os_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-global-shortcut = "2"
encoding_rs = "0.8"
quick-xml = "0.42"
pulldown-cmark = { version = "0.13", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
pdfium-render = { version = "0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe", "image_025"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.11"
unicode-segmentation = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
ignore = "0.4"
tokio-util = { version = "0.7", default-features = false }
notify-debouncer-full = "0.8"
tauri-plugin-dialog = "2"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
# Only restore_update/install are called; its own HTTP client never is (ADR-022).
tauri-plugin-updater = { version = "2.14.1", default-features = false }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
proptest = { version = "1", default-features = false, features = ["std"] }
ts-rs = "12"
# Sign throwaway update packages in tests (minisign format by hand). Both are already in the build graph.
ring = "0.17"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["accelerate"] }
candle-nn = { version = "0.11.1", features = ["accelerate"] }
candle-transformers = { version = "0.11.1", features = ["accelerate"] }
security-framework = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSCalendar", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSProcessInfo", "NSString", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGColorSpace", "CGDataProvider", "CGEventSource", "CGEventTypes"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-foundation", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes"] }
